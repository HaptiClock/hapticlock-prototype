<!DOCTYPE html>
<html>

<head>
  <title>LSR Light Levels</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <h2>Normalized Light Levels</h2>
  <canvas id="myChart" width="400" height="200"></canvas>
  <script>
    var ctx = document.getElementById('myChart').getContext('2d');
    var chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ["1:25", "1:40", "1:55", "2:10", "2:25", "2:40", "2:55",
          "3:10", "3:25", "3:40", "3:55", "4:10", "4:25", "4:40",
          "4:55", "5:10", "5:25", "5:40", "5:55", "6:10", "6:25",
          "6:40", "6:55", "7:10", "7:25", "7:40", "7:55", "8:10",
          "8:25", "8:40", "8:55", "9:10"],
        datasets: [{
          label: 'Normalized Light Level',
          data: [0.893, 0.018, 0.017, 0.016, 0.017, 0.016, 0.017,
            0.017, 0.018, 0.016, 0.017, 0.016, 0.017, 0.017,
            0.017, 0.017, 0.016, 0.015, 0.017, 0.017, 0.020,
            0.061, 0.197, 0.358, 0.465, 0.540, 0.746, 0.710,
            0.995, 1.000, 0.994, 0.995],
          borderColor: 'rgba(75, 192, 192, 1)',
          borderWidth: 2,
          fill: false
        }]
      },
      options: {
        scales: {
          y: { beginAtZero: true, max: 1 }
        }
      }
    });
  </script>
</body>

</html>
